    <!-- Fonts: Inter variable font, full weight range 100–900 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" media="print" onload="this.media='all'" />

    <!-- iOS Home Screen reports a short viewport (WebKit 254868). Size the shell to the glass before paint. -->
    <script>
      (function () {
        var root = document.documentElement;
        var BLANK_KEY = 'shribely-blank-reload';
        var leftAt = 0;
        function standalone() {
          return window.navigator.standalone === true
            || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        }
        // Same rules as screenFill() in src/pwaResume.js.
        function screenFill(screenH, innerH) {
          var screen = Number(screenH) || 0;
          var inner = Number(innerH) || 0;
          var sane = screen > 0 && screen <= 1600;
          if (inner > 0 && sane && screen < inner * 2) return screen + 'px';
          if (inner > 0) return '100vh';
          if (sane) return screen + 'px';
          return '';
        }
        function pin() {
          if (!standalone()) return;
          root.classList.add('home-screen');
          var fill = screenFill(window.screen.height, window.innerHeight);
          if (!fill) return;
          root.style.setProperty('--screen-fill', fill);
          // black-translucent shifts the document down on launch and leaves a band at the bottom.
          window.scrollTo(0, 0);
        }
        function recover() {
          if (!standalone()) return;
          var app = document.getElementById('root');
          var count = app ? app.childElementCount : 0;
          if (count > 0) {
            try { sessionStorage.removeItem(BLANK_KEY); } catch (e) {}
            return;
          }
          try {
            if (sessionStorage.getItem(BLANK_KEY) === '1') return;
            sessionStorage.setItem(BLANK_KEY, '1');
          } catch (e) { return; }
          window.location.reload();
        }
        pin();
        window.addEventListener('resize', pin);
        window.addEventListener('orientationchange', pin);
        window.addEventListener('pageshow', function (event) {
          pin();
          if (event.persisted) recover();
        });
        window.addEventListener('load', function () {
          pin();
          setTimeout(pin, 50);
          setTimeout(pin, 300);
          setTimeout(function () {
            var app = document.getElementById('root');
            if (app && app.childElementCount > 0) {
              try { sessionStorage.removeItem(BLANK_KEY); } catch (e) {}
            }
          }, 1000);
        });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') {
            leftAt = Date.now();
            return;
          }
          if (!leftAt) return;
          pin();
          setTimeout(pin, 50);
          setTimeout(pin, 300);
          setTimeout(recover, 400);
        });
      })();
    </script>

    <div id="root"></div>
